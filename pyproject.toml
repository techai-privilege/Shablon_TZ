[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trademark-report-mvp"
version = "0.1.0"
description = "MVP for preparing Russian trademark search reports"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "Pillow>=10,<12",
    "PySide6-Essentials>=6.7,<7",
    "python-docx>=1.1,<2",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
build = ["pyinstaller>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
