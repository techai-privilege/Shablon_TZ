[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trademark-report-mvp"
version = "0.2.2"
description = "MVP for preparing Russian trademark search reports"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "Pillow>=10,<12",
    "pypdf>=5,<7",
    "PySide6-Essentials>=6.7,<7",
    "python-docx>=1.1,<2",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]
build = ["pyinstaller>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
