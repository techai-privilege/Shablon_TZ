name: Build Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag
        required: true
        default: v0.1.2

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[build,dev]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build application
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed
          --name "Отчет по товарному знаку"
          --add-data "assets;assets"
          --add-data "data;data"
          app.py

      - name: Verify packaged application
        shell: pwsh
        run: |
          $executable = "dist\Отчет по товарному знаку\Отчет по товарному знаку.exe"
          if (-not (Test-Path $executable)) {
            throw "Windows executable was not created: $executable"
          }
          & $executable --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged application self-test failed with exit code $LASTEXITCODE"
          }

      - name: Create downloadable archive
        shell: pwsh
        run: |
          $archive = "Trademark-Report-$env:RELEASE_TAG-Windows-x64.zip"
          $archivePath = "dist\$archive"
          Compress-Archive -Path "dist\Отчет по товарному знаку" -DestinationPath $archivePath -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archivePath).Hash.ToLower()
          "$hash  $archive" | Set-Content -Path "$archivePath.sha256" -Encoding ascii

      - name: Attach files to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:RELEASE_TAG `
            "dist\Trademark-Report-$env:RELEASE_TAG-Windows-x64.zip" `
            "dist\Trademark-Report-$env:RELEASE_TAG-Windows-x64.zip.sha256" `
            --clobber
