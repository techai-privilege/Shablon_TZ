name: Build macOS Intel

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag
        required: true
        default: v0.2.0

permissions:
  contents: write

jobs:
  build-x64:
    runs-on: macos-15-intel
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[build,dev]'

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build application
        run: |
          python -m PyInstaller --noconfirm --clean --windowed \
            --name "Отчет по товарному знаку" \
            --add-data "assets:assets" \
            --add-data "data:data" \
            app.py

      - name: Verify Intel build
        run: |
          executable="dist/Отчет по товарному знаку.app/Contents/MacOS/Отчет по товарному знаку"
          file "$executable"
          file "$executable" | grep -q x86_64
          "$executable" --self-test
          xattr -cr "dist/Отчет по товарному знаку.app"
          codesign --verify --deep --strict "dist/Отчет по товарному знаку.app"

      - name: Create downloadable archive
        run: |
          archive="Trademark-Report-${RELEASE_TAG}-macOS-Intel.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Отчет по товарному знаку.app" "dist/$archive"
          cd dist
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Attach files to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/Trademark-Report-${RELEASE_TAG}-macOS-Intel.zip" \
            "dist/Trademark-Report-${RELEASE_TAG}-macOS-Intel.zip.sha256" \
            --clobber
